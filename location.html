<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>موقعیت ما</title>

<link rel="stylesheet" href="https://static.neshan.org/sdk/leaflet/v1.9.4/neshan-sdk/v1.0.8/index.css" />
<script src="https://static.neshan.org/sdk/leaflet/v1.9.4/neshan-sdk/v1.0.8/index.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;700;900&display=swap" rel="stylesheet">

<style>
  :root{
    --green:#478350; --gold:#BF843E; --red:#FF4D3F; --teal:#bf7c3e;
    --ink:#0e0e0e; --paper:#FBF6EC; --stroke:4px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; overflow:hidden;}
  body{font-family:"Vazirmatn",system-ui,sans-serif; background:var(--paper); color:var(--ink);}
  .app{height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;}

  /* ---------- TOP BAR (small logo, top-right) ---------- */
  .topbar{
    flex:0 0 auto; height:clamp(60px, 9dvh, 78px);
    background:var(--teal); border-bottom:var(--stroke) solid var(--ink);
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:0 clamp(12px,4vw,22px);
  }
  .topbar .logo{height:clamp(42px, 6.4dvh, 58px); width:auto; display:block; justify-self:start;}
  .topbar .flower{height:clamp(46px, 7.6dvh, 66px); width:auto; display:block; justify-self:center;}
  .topbar .title{font-weight:900; font-size:clamp(13px,3.6vw,17px); color:var(--ink); justify-self:end;}

  /* ---------- MAP ---------- */
  .map-wrap{flex:1 1 auto; min-height:0; position:relative; background:#e9e4d8;}
  #map{position:absolute; inset:0;}
  .leaflet-control-attribution{font-size:9px; opacity:.7;}

  .float-pin{position:relative; width:40px; height:52px; cursor:pointer;}
  .float-pin .pin{
    position:absolute; left:50%; top:0; width:34px; height:34px; margin-left:-17px;
    border-radius:50% 50% 50% 2px; transform:rotate(45deg);
    background:var(--red); border:3px solid var(--ink); box-shadow:0 4px 0 rgba(14,14,14,.25);
    animation:bob 1.6s ease-in-out infinite;
  }
  .float-pin .pin::after{content:""; position:absolute; inset:0; margin:auto; width:11px; height:11px; border-radius:50%; background:var(--paper); border:2px solid var(--ink); transform:translate(-1px,-1px);}
  .float-pin .pulse{position:absolute; left:50%; top:30px; width:22px; height:9px; margin-left:-11px; border-radius:50%; background:rgba(14,14,14,.28); animation:shadow 1.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{top:0} 50%{top:-7px}}
  @keyframes shadow{0%,100%{transform:scale(1);opacity:.28} 50%{transform:scale(.7);opacity:.16}}

  .fab{
    position:absolute; top:12px; right:12px; z-index:500;
    width:46px; height:46px; border-radius:14px; background:var(--paper);
    border:var(--stroke) solid var(--ink); box-shadow:3px 3px 0 var(--ink);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .fab:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
  .fab svg{width:24px;height:24px;}

  .go-btn{
    position:absolute; left:50%; bottom:16px; transform:translateX(-50%); z-index:500;
    display:flex; align-items:center; gap:9px; padding:12px 26px; border-radius:999px;
    background:var(--teal); color:var(--ink); border:var(--stroke) solid var(--ink);
    box-shadow:5px 5px 0 var(--ink); font-family:inherit; font-weight:900;
    font-size:clamp(15px,4.2vw,18px); cursor:pointer; white-space:nowrap;
  }
  .go-btn:active{transform:translateX(-50%) translateY(3px); box-shadow:2px 2px 0 var(--ink);}
  .go-btn svg{width:22px;height:22px;}

  .map-placeholder{position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding:22px; background:repeating-linear-gradient(45deg,#efe9db 0 18px,#e9e2d2 18px 36px); z-index:400;}
  .map-placeholder .pin0{width:50px; height:50px; border-radius:50% 50% 50% 2px; transform:rotate(45deg); background:var(--red); border:var(--stroke) solid var(--ink);}
  .map-placeholder h2{margin:4px 0 0; font-size:clamp(14px,4.4vw,18px); font-weight:900;}
  .map-placeholder p{margin:0; font-size:13px; color:#5a564d; max-width:300px; line-height:1.85;}

  /* ---------- FOOTER ---------- */
  .footer{
    flex:0 0 auto; background:var(--green); border-top:var(--stroke) solid var(--ink);
    padding:10px clamp(12px,4vw,22px); padding-bottom:calc(10px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:14px; cursor:pointer;
  }
  .footer .badge{flex:0 0 auto; width:46px; height:46px; border-radius:14px; background:var(--teal); border:var(--stroke) solid var(--ink); display:flex; align-items:center; justify-content:center; box-shadow:3px 3px 0 var(--ink);}
  .footer .badge svg{width:23px;height:23px;}
  .footer .text{min-width:0; flex:1;}
  .footer .label{font-size:11px; font-weight:700; letter-spacing:.04em; color:#FCEFD6; margin-bottom:1px;}
  .footer .line{font-size:clamp(13px,3.8vw,16px); font-weight:700; line-height:1.6; color:var(--paper);}
  .footer .chev{flex:0 0 auto; color:var(--paper); opacity:.7;}

  /* ---------- directions sheet ---------- */
  .sheet-mask{position:fixed; inset:0; z-index:900; display:none; background:rgba(14,14,14,.45); align-items:flex-end; justify-content:center;}
  .sheet-mask.open{display:flex;}
  .sheet{width:min(520px,100%); background:var(--paper); border:var(--stroke) solid var(--ink); border-bottom:none; border-radius:24px 24px 0 0; padding:18px; padding-bottom:calc(18px + env(safe-area-inset-bottom)); animation:up .22s ease;}
  @keyframes up{from{transform:translateY(40px); opacity:.4} to{transform:none; opacity:1}}
  .sheet h3{margin:2px 0 14px; font-size:16px; font-weight:900; text-align:center;}
  .sheet .opt{display:flex; align-items:center; gap:12px; width:100%; padding:13px 16px; margin-bottom:10px; border-radius:16px; border:var(--stroke) solid var(--ink); background:#fff; font-family:inherit; font-size:15px; font-weight:800; color:var(--ink); cursor:pointer; text-decoration:none;}
  .sheet .opt:active{transform:translateY(2px);}
  .sheet .opt.neshan{background:var(--teal);}
  .sheet .opt .ic{width:26px;height:26px; flex:0 0 auto; display:flex;align-items:center;justify-content:center;}
  .sheet .cancel{width:100%; text-align:center; padding:12px; margin-top:2px; background:none; border:none; font-family:inherit; font-size:14px; font-weight:700; color:#7a766c; cursor:pointer;}

  @media (orientation:landscape) and (max-height:430px){
    .topbar{height:54px;}
    .go-btn{bottom:10px; padding:9px 20px;}
    .fab{width:40px;height:40px;}
  }
</style>
</head>

    <!-- MAP -->
    <main class="map-wrap">
      <div id="map"></div>

      <div class="fab" id="recenter" title="برگشت به موقعیت" aria-label="recenter">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0e0e0e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8.2"/>
        </svg>
      </div>

      <button class="go-btn" id="go" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0e0e0e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
        بزن بریم
      </button>

      <div class="map-placeholder" id="placeholder">
        <div class="pin0"></div>
        <h2>نقشه در حال بارگذاری…</h2>
        <p>اگر نقشه نمایش داده نشد، مطمئن شوید کلید نشان برای دامنه‌ی شما مجاز است.</p>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer" id="footer">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0e0e0e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      </div>
      <div class="text">
        <div class="label">آدرس ما — برای مسیریابی بزنید</div>
        <div class="line" id="addr-line"></div>
      </div>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </footer>

  </div>

  <div class="sheet-mask" id="sheetMask">
    <div class="sheet" role="dialog" aria-label="مسیریابی">
      <h3>با کدام برنامه مسیریابی می‌کنید؟</h3>
      <a class="opt neshan" id="optNeshan" target="_blank" rel="noopener"><span class="ic">🧭</span> مسیریاب نشان</a>
      <a class="opt" id="optGoogle" target="_blank" rel="noopener"><span class="ic">🗺️</span> گوگل مپ</a>
      <button class="cancel" id="optCancel" type="button">بستن</button>
    </div>
  </div>

<script>
  const CONFIG = {
    NESHAN_KEY: "web.0b356ac8b39849899e507b3bfb5904ac",
    LAT: 35.70562,
    LNG: 51.4232,
    ZOOM: 16,
    ADDRESS: "خیابان سمیه، بین مفتح و ایرانشهر، پلاک ۱۴۷"
  };

  document.getElementById('addr-line').textContent = CONFIG.ADDRESS;
  const neshanUrl = `https://neshan.org/maps/@${CONFIG.LAT},${CONFIG.LNG},${CONFIG.ZOOM}z`;
  const googleUrl = `https://www.google.com/maps/dir/?api=1&destination=${CONFIG.LAT},${CONFIG.LNG}&travelmode=driving`;
  document.getElementById('optNeshan').href = neshanUrl;
  document.getElementById('optGoogle').href = googleUrl;

  const mask = document.getElementById('sheetMask');
  const openSheet = () => mask.classList.add('open');
  const closeSheet = () => mask.classList.remove('open');
  document.getElementById('go').addEventListener('click', openSheet);
  document.getElementById('footer').addEventListener('click', openSheet);
  document.getElementById('optCancel').addEventListener('click', closeSheet);
  mask.addEventListener('click', e => { if(e.target === mask) closeSheet(); });

  let map;
  try {
    map = new L.Map("map", { key: CONFIG.NESHAN_KEY, maptype: "dreamy", poi: true, traffic: false, center: [CONFIG.LAT, CONFIG.LNG], zoom: CONFIG.ZOOM });
    const icon = L.divIcon({ className:'', html:'<div class="float-pin"><span class="pulse"></span><span class="pin"></span></div>', iconSize:[40,52], iconAnchor:[20,36] });
    const marker = L.marker([CONFIG.LAT, CONFIG.LNG], { icon }).addTo(map);
    marker.on('click', openSheet);
    document.getElementById('recenter').addEventListener('click', () => map.setView([CONFIG.LAT, CONFIG.LNG], CONFIG.ZOOM, { animate:true }));
    window.addEventListener('resize', () => setTimeout(() => map.invalidateSize(), 150));
  } catch (err) {
    document.getElementById('placeholder').style.display = 'flex';
  }
</script>
